        neoForge.runs.client.systemProperty 'anvilcraft.portMultiblockScene', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
    }
    if (providers.gradleProperty('portStructureDiskScene').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portVisualScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portStructureDiskScene', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
    }
    if (providers.gradleProperty('portStorageFluidScene').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portVisualScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portStorageFluidScene', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
    }
    if (providers.gradleProperty('portStorageFluidItemScene').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portVisualScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portStorageFluidItemScene', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
    }
    if (providers.gradleProperty('portSmartPlacerScene').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portVisualScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portSmartPlacerScene', 'true'
        if (providers.gradleProperty('portPreviewRaw').isPresent()) neoForge.runs.client.systemProperty 'anvilcraft.portPreviewRaw', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
