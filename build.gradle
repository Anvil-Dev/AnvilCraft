plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    alias libs.plugins.modDevGradle
    alias libs.plugins.lombok
    alias libs.plugins.machete
}

String buildType
String buildNumber = System.getenv("GITHUB_RUN_NUMBER")
String buildTypeEnv = System.getenv("BUILD_TYPE")
if (buildTypeEnv == "pr") {
    buildType = 'pr'
} else if (buildTypeEnv == "hotfix") {
    buildType = 'hotfix'
} else if (buildTypeEnv == "snapshot") {
    buildType = 'snapshot'
} else if (buildTypeEnv == "release") {
    buildType = null
    buildNumber = null
} else {
    buildType = 'build'
}
def githubRef = System.getenv("GITHUB_REF")
if (githubRef != null && githubRef.startsWith("refs/tags/")) {
    version = githubRef.substring(githubRef.lastIndexOf('/') + 1)
} else {
    version = "${mod_version}" + (buildNumber != null ? "+${buildType}.${buildNumber}" : "")
}
group = maven_group

apply from: "$rootDir/gradle/scripts/moddevgradle.gradle"
apply from: "$rootDir/gradle/scripts/repositories.gradle"
apply from: "$rootDir/gradle/scripts/jars.gradle"
apply from: "$rootDir/gradle/scripts/publishing.gradle"
apply from: "$rootDir/gradle/scripts/resources.gradle"
apply from: "$rootDir/dependencies.gradle"

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

if (providers.gradleProperty('portValidation').isPresent()) {
    sourceSets.main.java.srcDir 'dev/porting/java'
    sourceSets.main.resources.srcDir 'dev/porting/resources'
    neoForge.runs.configureEach {
        gameDirectory = file("run/port-validation/${name}")
    }
    if (providers.gradleProperty('portClientSmoke').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portClientSmoke', 'true'
    }
    if (providers.gradleProperty('portVisualScene').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portVisualScene', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
    }
    if (providers.gradleProperty('portItemSplitterScene').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portVisualScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portItemSplitterScene', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
    }
    if (providers.gradleProperty('portOverflowScene').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portVisualScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portOverflowScene', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
    }
    if (providers.gradleProperty('portConsolidatorScene').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portVisualScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portConsolidatorScene', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
    }
    if (providers.gradleProperty('portStoragePortScene').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portVisualScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portStoragePortScene', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
    }
    if (providers.gradleProperty('portStorageItemScene').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portVisualScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portStorageItemScene', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
    }
    if (providers.gradleProperty('portStorageFluidUiScene').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portVisualScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portStorageFluidUiScene', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
    }
    if (providers.gradleProperty('portStorageUndoScene').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portVisualScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portStorageFluidUiScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portStorageUndoScene', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
    }
    if (providers.gradleProperty('portStorageLongScene').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portVisualScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portStorageLongScene', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
    }
    if (providers.gradleProperty('portCraftingStateScene').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portVisualScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portStorageLongScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portCraftingStateScene', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
    }
    if (providers.gradleProperty('portCraftingInputsScene').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portVisualScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portStorageLongScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portCraftingStateScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portCraftingInputsScene', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
    }
    if (providers.gradleProperty('portCraftingExecutionScene').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portVisualScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portStorageLongScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portCraftingStateScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portCraftingInputsScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portCraftingExecutionScene', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
    }
    if (providers.gradleProperty('portCraftingBatchScene').isPresent()) {
