plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    alias libs.plugins.modDevGradle
    alias libs.plugins.lombok
    alias libs.plugins.machete
}

String buildType
String buildNumber = System.getenv("GITHUB_RUN_NUMBER")
String buildTypeEnv = System.getenv("BUILD_TYPE")
if (buildTypeEnv == "pr") {
    buildType = 'pr'
} else if (buildTypeEnv == "hotfix") {
    buildType = 'hotfix'
} else if (buildTypeEnv == "snapshot") {
    buildType = 'snapshot'
} else if (buildTypeEnv == "release") {
    buildType = null
    buildNumber = null
} else {
    buildType = 'build'
}
def githubRef = System.getenv("GITHUB_REF")
if (githubRef != null && githubRef.startsWith("refs/tags/")) {
    version = githubRef.substring(githubRef.lastIndexOf('/') + 1)
} else {
    version = "${mod_version}" + (buildNumber != null ? "+${buildType}.${buildNumber}" : "")
}
group = maven_group

apply from: "$rootDir/gradle/scripts/moddevgradle.gradle"
apply from: "$rootDir/gradle/scripts/repositories.gradle"
apply from: "$rootDir/gradle/scripts/jars.gradle"
apply from: "$rootDir/gradle/scripts/publishing.gradle"
apply from: "$rootDir/gradle/scripts/resources.gradle"
apply from: "$rootDir/dependencies.gradle"

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

if (providers.gradleProperty('portValidation').isPresent()) {
    sourceSets.main.java.srcDir 'dev/porting/java'
    sourceSets.main.resources.srcDir 'dev/porting/resources'
    neoForge.runs.configureEach {
        gameDirectory = file("run/port-validation/${name}")
    }
    if (providers.gradleProperty('portClientSmoke').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portClientSmoke', 'true'
    }
    if (providers.gradleProperty('portTerminalBalanceScene').isPresent()) {
        neoForge.runs.client.systemProperty 'anvilcraft.portVisualScene', 'true'
