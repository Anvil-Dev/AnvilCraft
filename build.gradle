        neoForge.runs.client.systemProperty 'anvilcraft.portStructureDiskDataScene', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
    }
    if (providers.gradleProperty('portFittedItemScene').isPresent()) {
