        neoForge.runs.client.systemProperty 'anvilcraft.portCraftingStateScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portCraftingInputsScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portCraftingExecutionScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portCraftingBatchScene', 'true'
        neoForge.runs.client.programArguments.addAll '--width', '1280', '--height', '720'
    }
    def storageMenuScene = providers.gradleProperty('portStorageMenuScene').isPresent()
    def storageTransferScene = storageMenuScene || providers.gradleProperty('portCraftingTransferScene').isPresent()
    def storageFlipScene = storageTransferScene || providers.gradleProperty('portStorageFlipScene').isPresent()
    if (providers.gradleProperty('portCraftingPanelScene').isPresent() || providers.gradleProperty('portCraftingDragScene').isPresent()
        || providers.gradleProperty('portCraftingPickupScene').isPresent() || storageFlipScene) {
        neoForge.runs.client.systemProperty 'anvilcraft.portVisualScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portStorageLongScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portCraftingStateScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portCraftingInputsScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portCraftingExecutionScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portCraftingBatchScene', 'true'
        neoForge.runs.client.systemProperty 'anvilcraft.portCraftingPanelScene', 'true'
        if (storageMenuScene) {
            neoForge.runs.client.systemProperty 'anvilcraft.portStorageMenuScene', 'true'
        }
        if (storageTransferScene) {
            neoForge.runs.client.systemProperty 'anvilcraft.portCraftingTransferScene', 'true'
        }
        if (storageFlipScene) {
            neoForge.runs.client.systemProperty 'anvilcraft.portStorageFlipScene', 'true'
        }
        if (providers.gradleProperty('portCraftingDragScene').isPresent() || providers.gradleProperty('portCraftingPickupScene').isPresent()
            || storageFlipScene) {
            neoForge.runs.client.systemProperty 'anvilcraft.portCraftingDragScene', 'true'
        }
        if (providers.gradleProperty('portCraftingPickupScene').isPresent() || storageFlipScene) {
