name: Create Multi-Version Releases
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 发布 tag 与构建版本，不带 v（例如 1.6.0+pre-release.13）
        type: string
        required: true
      generate_release_notes:
        description: Include GitHub-generated release notes from dev/1.21/1.6
        type: boolean
        default: false
      dry_run:
        description: Build and verify both releases without publishing
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: anvilcraft-coordinated-release
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BUILD_TYPE: release
  RELEASE_TAG: ${{ inputs.tag }}
  DRY_RUN: ${{ inputs.dry_run }}
  GENERATE_RELEASE_NOTES: ${{ inputs.generate_release_notes }}

jobs:
  prepare:
    if: github.ref == 'refs/heads/dev/1.21/1.6'
    runs-on: ubuntu-latest
    # GitHub 的发布说明预览接口也要求 contents: write。
    permissions: { contents: write, actions: read }
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      bump_patch: ${{ steps.plan.outputs.bump_patch }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - name: Check release recovery and publication gates
        run: python3 -m unittest discover -s .github/release
      - id: plan
        run: python3 .github/release/release.py prepare
      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.new == 'true'
        with:
          name: source-plan
          path: release-plan.json
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      LINE: ${{ matrix.line }}
      SOURCE_SHA: ${{ matrix.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with: { path: control, persist-credentials: false }
      - id: cache
        working-directory: control/.github/release
        run: python3 -c 'import os; from common import artifact, output; output("built", bool(artifact("build-" + os.environ["LINE"])))'
      - uses: actions/checkout@v6
        if: steps.cache.outputs.built != 'True'
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v5
        if: steps.cache.outputs.built != 'True'
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        if: steps.cache.outputs.built != 'True'
      - name: Stage and verify local publications
        if: steps.cache.outputs.built != 'True'
        run: |
          (cd source && bash gradlew -PanvilcraftRelease "-Pmod_version=$RELEASE_VERSION" stageRelease --no-configuration-cache)
          python3 control/.github/release/artifacts.py source "$LINE" "$SOURCE_SHA" "$RELEASE_VERSION" source/build/release/dist
      - uses: actions/upload-artifact@v7
        if: steps.cache.outputs.built != 'True'
        with:
          name: build-${{ matrix.line }}
          path: source/build/release/
          if-no-files-found: error

  seal:
    name: Upload ReleaseFile
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read }
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { name: source-plan }
      - uses: actions/download-artifact@v8
        with: { pattern: 'build-*', path: bundles }
      - run: python3 .github/release/release.py seal

  maven:
    needs: [prepare, seal]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { actions: read, contents: read, statuses: write }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      LINE: ${{ matrix.line }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.line }}
          path: built
      - name: 上传原版 Maven 文件并核验远端
        env:
          MAVEN_URL: ${{ secrets.MAVEN_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASS }}
        run: python3 .github/release/maven.py "$TAG" "$LINE" built/staging

  mod-sites:
    needs: [prepare, seal]
    if: ${{ !inputs.dry_run }}
    permissions: { actions: read, contents: read, statuses: write }
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.matrix) }}
        platform: [modrinth, curseforge]
    name: ${{ matrix.platform }} / ${{ matrix.target.line }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - name: Upload verified files once
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          LINE: ${{ matrix.target.line }}
          PLATFORM: ${{ matrix.platform }}
          MODRINTH_TOKEN: ${{ matrix.platform == 'modrinth' && secrets.MODRINTH_TOKEN || '' }}
          CURSEFORGE_TOKEN: ${{ matrix.platform == 'curseforge' && secrets.CURSEFORGE_TOKEN || '' }}
          MAVEN_URL: ${{ secrets.MAVEN_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASS }}
        run: python3 .github/release/mod_sites.py "$TAG" "$LINE" "$PLATFORM"

  publish:
    needs: [prepare, seal, maven]
    runs-on: ubuntu-latest
    permissions: { contents: write, statuses: read }
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - run: python3 .github/release/release.py publish "$TAG"

  bump:
    needs: [prepare, publish]
    if: needs.prepare.outputs.bump_patch == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      LINE: ${{ matrix.line }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - run: python3 .github/release/release.py bump "$TAG" "$LINE"
