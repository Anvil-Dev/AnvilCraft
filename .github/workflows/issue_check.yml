name: Check Issue Format and Version
on:
  issues:
    types: [opened, edited, reopened]

# Reported build numbers are `ci.yml` run numbers: snapshots come from the `dev/<mc>/<mod>`
# branches and hotfix builds from the matching `releases/<mc>/<mod>` branch (the one with
# `BUILD_TYPE: hotfix`), so the version check reads the Actions API with the repository token
# instead of a release site. `run_number` counts runs across the whole repository, so it must not
# be used as a build lag; branch names say which Minecraft line a run belongs to, and the lag is
# counted per line, so `1.21.1` and `26.1.2` never inflate each other. Pre-release numbers restart
# with every mod version, so those are dated instead of compared by number.
jobs:
  check:
    if: ${{ !github.event.issue.pull_request && github.event.issue.state == 'open' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    concurrency:
      group: issue-check-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Check issue format and version
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const number = issue.number;
            const body = issue.body ?? '';

            if (issue.pull_request) {
              core.info(`#${number} is a pull request, skipping.`);
              return;
            }

            // Only the author and people with write access can edit or re-open an issue, so any
            // other actor means a maintainer is curating this issue by hand and the check steps
            // aside. Re-opening is also the documented way to say "this still matters".
            if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(issue.author_association)) {
              core.info(`#${number} was opened by a ${issue.author_association}, skipping.`);
              return;
            }
            const actor = context.payload.sender?.login;
            if (actor !== undefined && actor !== issue.user?.login) {
              core.info(`#${number} was last changed by ${actor} rather than its author, skipping.`);
              return;
            }

            const minBuildLag = 50;
            const maxRunPages = 12;
            const marker = '<!-- anvilcraft-issue-check -->';
            const outdatedLabel = '⏰ Outdated';
            const invalidLabel = '❌︎ Invalid';

            const reasons = [];
            const note = (kind, text) => reasons.push({ kind, text });

            // A section body, taken from the last heading that starts with `heading`, so a plain
            // line written inside an earlier field cannot shadow the real section.
            const sectionText = (text, heading) => {
              const headingPattern = new RegExp(`^###\\s+${heading}(\\s|$)`);
              const lines = text.split(/\r?\n/);
              let start = -1;
              for (let index = 0; index < lines.length; index += 1) {
                if (headingPattern.test(lines[index])) {
                  start = index;
                }
              }
              if (start === -1) {
                return '';
              }
              const section = [];
              for (let index = start + 1; index < lines.length; index += 1) {
                if (/^###\s/.test(lines[index])) {
                  break;
                }
                section.push(lines[index]);
              }
              return section.join('\n');
            };

            // The separator must be a real one (`.`, `-`, `_`); a channel is never followed
            // directly by a number. Whitespace is excluded as well, because ordinary prose such
            // as `(build 7)` or `hotfix 3 times` would otherwise parse as a version and close a
            // perfectly current issue. No published version uses either shape.
            const channelPattern = /\b(snapshot|hotfix|pre-?release|build)\b[.\-_]+(\d{1,6})/gi;
            const parseBuilds = (text) => {
              const cleaned = text
                .replace(/<!--[\s\S]*?-->/g, ' ')
                .replace(/`/g, '')
                .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');
              const reported = new Map();
              for (const match of cleaned.matchAll(channelPattern)) {
                const channel = match[1].toLowerCase().replace(/^prerelease$/, 'pre-release');
                const build = Number(match[2]);
                if (build > (reported.get(channel) ?? 0)) {
                  reported.set(channel, build);
                }
              }
              return reported;
            };

            const admitted = body
              .split(/\r?\n/)
              .some((line) => {
                const checkbox = line.match(/^\s*[-*]\s*\[[xX]\]\s*(.+)$/);
                return checkbox !== null
                  && checkbox[1].toLowerCase().includes('i admit that i previously checked all options');
              });
            if (admitted) {
              note('format',
                '- The checklist option "I admit that I previously checked all options without thorough verification and directly submitted this Issue" is checked.\n'
                + '  勾选了「我承认此前未充分核实便勾选了所有选项并直接提交此 Issue ，且同意该 Issue 可被直接关闭。」选项。');
            }

            const title = issue.title ?? '';
            if (!/^\[[^\[\]]+\]\s+\S/.test(title)) {
              note('format',
                '- The title must start with a bracketed prefix, followed by a space and the title text, for example `[Bug] Something is broken`.\n'
                + '  标题必须以方括号前缀开头，且方括号与后续标题之间需要有一个空格，例如 `[Bug] 某个问题`。');
            }

            const versionSection = sectionText(body, 'Version Details');
            const reportedBuilds = parseBuilds(versionSection);
            if (reportedBuilds.size > 0) {
              // Only a `major.minor` pair identifies a line, so `1.21.1` and `1.21` agree. A field
              // can also name something else first (a loader version, say), so every pair is kept
              // as a candidate and the one naming a real line is used.
              const lineCandidates = [...new Set(
                [...sectionText(body, 'Minecraft Version Details').matchAll(/(\d+)\.(\d+)/g)]
                  .map((match) => `${match[1]}.${match[2]}`)
              )];
              try {
                if (lineCandidates.length === 0) {
                  core.warning(`#${number} does not state a Minecraft version, skipping the version check.`);
                } else {
                  // A pre-release number only means something inside its own mod version, so the
                  // tag it refers to is looked up first and later dated against the run history.
                  let preRelease;
                  let preReleaseTime = null;
                  const reportedPreRelease = reportedBuilds.get('pre-release');
                  if (reportedPreRelease !== undefined) {
                    const releases = await github.paginate(github.rest.repos.listReleases, {
                      owner,
                      repo,
                      per_page: 100
                    });
                    // Several mod versions reuse the same pre-release number, so a tag quoted in
                    // the issue wins over the newest tag that merely shares the number.
                    const candidates = releases.filter(
                      (entry) => new RegExp(`\\+pre-release\\.${reportedPreRelease}$`).test(entry.tag_name)
                    );
                    preRelease = candidates.find((entry) => versionSection.includes(entry.tag_name))
                      ?? candidates.sort((left, right) => new Date(right.published_at) - new Date(left.published_at))[0];
                    if (preRelease === undefined) {
                      core.warning(`No release tag matches pre-release.${reportedPreRelease} of #${number}.`);
                    } else {
                      preReleaseTime = new Date(preRelease.published_at);
                    }
                  }

                  // Reported numbers are `ci.yml` run numbers, but that counter is shared by every
                  // branch in the repository, so a gap of N run numbers is not N builds of one
                  // line. The lag is therefore counted from the line's own builds: a branch
                  // belongs to a line when one of its path segments is that line, which tolerates
                  // both `dev/1.21/1.6` and `releases/1.5/1.21`. A run keeps the branch it ran on
                  // even after that branch was deleted, so deleted release branches stay readable.
                  const runs = [];
                  const onLine = (prefix, target) => runs
                    .filter((run) => run.head_branch.startsWith(prefix)
                      && run.head_branch.split('/').includes(target))
                    .sort((left, right) => right.run_number - left.run_number);
                  const newerThan = (chain, reported) => chain.filter((run) => run.run_number > reported);

                  let line = null;
                  // Reading stops once every reported number is decided, so a current issue costs a
                  // single request. Runs come newest first, so a channel is decided when either its
                  // chain reaches back to the reported build (exact count known) or enough newer
                  // builds were already seen for the threshold to be crossed however far back the
                  // history goes.
                  const undecided = () => {
                    const oldest = Math.min(...runs.map((run) => run.run_number));
                    const chainOn = (channel) => onLine(channel === 'hotfix' ? 'releases/' : 'dev/', line);
                    // Release runs live in a closed window, so once the read window reaches the
                    // newest release run anywhere, a line still holding none will never hold one.
                    const releaseRuns = runs.filter((run) => run.head_branch.startsWith('releases/'));
                    const newestRelease = releaseRuns.length === 0
                      ? null
                      : Math.max(...releaseRuns.map((run) => run.run_number));
                    for (const channel of ['snapshot', 'build', 'hotfix']) {
                      const reported = reportedBuilds.get(channel);
                      if (reported === undefined) {
                        continue;
                      }
                      const chain = chainOn(channel);
                      const decided = chain.some((run) => run.run_number <= reported)
                        || newerThan(chain, reported).length >= minBuildLag
                        || (channel === 'hotfix'
                          && chain.length === 0
                          && newestRelease !== null
                          && oldest <= newestRelease);
                      if (!decided) {
                        return true;
                      }
                    }
                    if (reportedPreRelease !== undefined && preReleaseTime !== null) {
                      const chain = chainOn('snapshot');
                      const decided = chain.some((run) => new Date(run.created_at) <= preReleaseTime)
                        || chain.filter((run) => new Date(run.created_at) > preReleaseTime).length >= minBuildLag;
                      if (!decided) {
                        return true;
                      }
                    }
                    return false;
                  };

                  for (let page = 1; page <= maxRunPages; page += 1) {
                    const response = await github.rest.actions.listWorkflowRuns({
                      owner,
                      repo,
                      workflow_id: 'ci.yml',
                      per_page: 100,
                      page
                    });
                    runs.push(...response.data.workflow_runs);
                    // The line is decided by the newest runs, because a live line always has a
                    // current development branch. Only a hotfix report can name a line whose
                    // branches are all deleted, so anything else that matches nothing is dropped
                    // here instead of reading the whole history to prove it.
                    if (line === null) {
                      line = lineCandidates.find((candidate) => onLine('dev/', candidate).length > 0
                        || onLine('releases/', candidate).length > 0) ?? null;
                    }
                    if (line === null && !reportedBuilds.has('hotfix')) {
                      core.warning(`#${number} names no ci.yml branch for ${lineCandidates.join(', ')}, skipping the version check.`);
                      break;
                    }
                    if (response.data.workflow_runs.length < 100
                      || (line !== null && !undecided())) {
                      break;
                    }
                  }

                  // `snapshot` and `build` are development builds, `hotfix` release builds. The
                  // lag counts builds of this line published after the reported one, not the raw
                  // difference of run numbers, which the other line inflates.
                  if (line === null) {
                    core.warning(`#${number} names no ci.yml branch for ${lineCandidates.join(', ')}, skipping the version check.`);
                  } else {
                    const development = onLine('dev/', line);
                    for (const channel of ['snapshot', 'build', 'hotfix']) {
                      const reported = reportedBuilds.get(channel);
                      if (reported === undefined) {
                        continue;
                      }
                      const chain = channel === 'hotfix' ? onLine('releases/', line) : development;
                      if (chain.length === 0) {
                        core.warning(`No ci.yml runs found for the ${channel} channel of the ${line} line.`);
                        continue;
                      }
                      const newer = newerThan(chain, reported);
                      if (newer.length >= minBuildLag) {
                        const behind = chain.some((run) => run.run_number <= reported)
                          ? `${newer.length}`
                          : `${newer.length}+`;
                        note('version',
                          `- The version reported in \`Version Details\` is \`${channel}.${reported}\`, and ${behind} newer \`${channel}\` builds of the ${line} line have been published since, the latest being \`${channel}.${chain[0].run_number}\` (closes when ${minBuildLag} or more builds behind).\n`
                          + `  版本信息中反馈的 \`${channel}.${reported}\`，其后 ${line} 线已发布 ${behind} 个更新的 \`${channel}\` 构建，最新为 \`${channel}.${chain[0].run_number}\`（落后达到 ${minBuildLag} 个构建即关闭），请更新到最新版本后再反馈。`);
                      }
                    }

                    if (reportedPreRelease !== undefined && preReleaseTime !== null) {
                      const since = development
                        .findIndex((run) => new Date(run.created_at) <= preReleaseTime);
                      if (since === -1 || since >= minBuildLag) {
                        // `-1` means the tag predates every run read back, so the count is a floor.
                        const reached = since === -1 ? `${development.length}+` : `${since}`;
                        note('version',
                          `- The pre-release \`${preRelease.tag_name}\` was published on ${preRelease.published_at.slice(0, 10)}, and ${reached} builds of the ${line} line have been published since (closes when ${minBuildLag} or more builds behind).\n`
                          + `  反馈的预发布版本 \`${preRelease.tag_name}\` 发布于 ${preRelease.published_at.slice(0, 10)}，其后 ${line} 线已发布 ${reached} 个构建（落后达到 ${minBuildLag} 个构建即关闭），请更新到最新版本后再反馈。`);
                      }
                    }
                  }
                }
              } catch (error) {
                core.warning(`Could not verify the reported version of #${number}: ${error.message}`);
              }
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: number,
              per_page: 100
            });
            // The marker identifies our own comment, but a user can paste it, so the author has to
            // be a bot as well before we edit or delete it.
            const previous = comments.find(
              (comment) => comment.user?.type === 'Bot' && (comment.body ?? '').includes(marker)
            );
            const presentLabels = (issue.labels ?? [])
              .map((label) => (typeof label === 'string' ? label : label.name));

            // A later edit can fix the issue, so a passing check withdraws what an earlier check
            // left. Both labels are ordinary triage labels a maintainer may have applied by hand,
            // so they are only taken back when our own closing comment proves the last close was
            // ours.
            if (reasons.length === 0) {
              if (previous === undefined) {
                core.info(`Issue #${number} passed the check.`);
                return;
              }
              core.info(`Issue #${number} passed the check, withdrawing the previous result.`);
              await github.rest.issues.deleteComment({ owner, repo, comment_id: previous.id });
              for (const label of [outdatedLabel, invalidLabel]) {
                if (presentLabels.includes(label)) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: label });
                }
              }
              return;
            }

            core.info(`Issue #${number} failed the check:\n${reasons.map((reason) => reason.text).join('\n')}`);

            const labels = [];
            if (reasons.some((reason) => reason.kind === 'format')) {
              labels.push(invalidLabel);
            }
            if (reasons.some((reason) => reason.kind === 'version')) {
              labels.push(outdatedLabel);
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels });

            const text = `${marker}\nThis issue was closed automatically because it does not follow the issue requirements. - 该 Issue 因不符合要求已被自动关闭。\n\n${reasons.map((reason) => reason.text).join('\n')}\n\nPlease fix the problem described above and reopen or recreate the issue. - 请修正以上问题后重新打开或重新提交 Issue。`;
            // Editing a comment does not notify anyone, so a re-open that still fails replaces the
            // old comment with a new one instead of silently rewriting it.
            if (previous !== undefined && context.payload.action === 'reopened') {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: previous.id });
            }
            if (previous === undefined || context.payload.action === 'reopened') {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body: text });
            } else {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body: text });
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: number,
              state: 'closed',
              state_reason: 'not_planned'
            });
