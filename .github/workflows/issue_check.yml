name: Check Issue Format
on:
  issues:
    types: [opened, edited, reopened]

# Build numbers reported in issues (`x.x.x+snapshot.N`) match the numbers used by the
# snapshots published on Modrinth, so `vuISAWPc` is used as the source of the latest version.
jobs:
  check:
    if: ${{ !github.event.issue.pull_request && github.event.issue.state == 'open' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check issue format
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const number = issue.number;
            const body = issue.body ?? '';

            if (issue.pull_request) {
              core.info(`#${number} is a pull request, skipping.`);
              return;
            }

            const modrinthProject = 'vuISAWPc';
            const minBuildLag = 50;

            const sectionText = (text, heading) => {
              const lines = text.split(/\r?\n/);
              const start = lines.findIndex(
                (line) => line.replace(/^###\s+/, '').startsWith(heading)
              );
              if (start === -1) {
                return '';
              }
              const section = [];
              for (let index = start + 1; index < lines.length; index += 1) {
                if (/^###\s/.test(lines[index])) {
                  break;
                }
                section.push(lines[index]);
              }
              return section.join('\n');
            };

            const buildPattern = /\b(snapshot|hotfix|pre-?release|build)\b[.\-_\s]*(\d{1,6})/gi;
            const parseBuilds = (text) => {
              const cleaned = text
                .replace(/<!--[\s\S]*?-->/g, ' ')
                .replace(/`/g, '')
                .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');
              const reported = new Map();
              for (const match of cleaned.matchAll(buildPattern)) {
                const channel = match[1].toLowerCase().replace(/^prerelease$/, 'pre-release');
                const build = Number(match[2]);
                if (build > (reported.get(channel) ?? 0)) {
                  reported.set(channel, build);
                }
              }
              return reported;
            };

            const reasons = [];

            const admitted = body
              .split(/\r?\n/)
              .some((line) => {
                const checkbox = line.match(/^\s*[-*]\s*\[[xX]\]\s*(.+)$/);
                return checkbox !== null
                  && checkbox[1].toLowerCase().includes('i admit that i previously checked all options');
              });
            if (admitted) {
              reasons.push(
                '- The checklist option "I admit that I previously checked all options without thorough verification and directly submitted this Issue" is checked.\n'
                + '  勾选了「我承认此前未充分核实便勾选了所有选项并直接提交此 Issue ，且同意该 Issue 可被直接关闭。」选项。'
              );
            }

            const title = issue.title ?? '';
            if (!/^\[[^\[\]]+\][ \t]+\S/.test(title)) {
              reasons.push(
                '- The title must start with a bracketed prefix, followed by a space and the title text, for example `[Bug] Something is broken`.\n'
                + '  标题必须以方括号前缀开头，且方括号与后续标题之间需要有一个空格，例如 `[Bug] 某个问题`。'
              );
            }

            const reportedText = sectionText(body, 'Version Details')
              .split(/\r?\n/)
              .map((line) => line.trim())
              .filter((line) => line.length > 0)
              .join(' ')
              .slice(0, 200);
            const reportedBuilds = parseBuilds(reportedText);
            if (reportedBuilds.size > 0) {
              try {
                const response = await fetch(`https://api.modrinth.com/v2/project/${modrinthProject}/version`, {
                  headers: { 'User-Agent': 'AnvilCraft-Issue-Format-Check' }
                });
                if (!response.ok) {
                  throw new Error(`Modrinth responded with ${response.status}`);
                }
                const released = await response.json();
                const latestByChannel = new Map();
                for (const version of released) {
                  for (const [channel, build] of parseBuilds(version.version_number ?? '')) {
                    const latest = latestByChannel.get(channel);
                    if (latest === undefined || build > latest.build) {
                      latestByChannel.set(channel, { build, version: version.version_number });
                    }
                  }
                }
                const outdated = [...reportedBuilds]
                  .map(([channel, build]) => ({ channel, build, latest: latestByChannel.get(channel) }))
                  .filter((entry) => entry.latest !== undefined)
                  .map((entry) => ({ ...entry, lag: entry.latest.build - entry.build }));
                if (outdated.length > 0 && outdated.every((entry) => entry.lag >= minBuildLag)) {
                  const worst = outdated.reduce((left, right) => (right.lag > left.lag ? right : left));
                  reasons.push(
                    `- The reported mod version is \`${reportedText}\`, which is ${worst.lag} ${worst.channel} builds behind the latest \`${worst.latest.version}\` (limit: ${minBuildLag}).\n`
                    + `  反馈的模组版本为 \`${reportedText}\`，比最新的 \`${worst.latest.version}\` 落后 ${worst.lag} 个版本（上限 ${minBuildLag}），请更新到最新版本后再反馈。`
                  );
                }
              } catch (error) {
                core.warning(`Could not read the latest version from Modrinth: ${error.message}`);
              }
            }

            if (reasons.length === 0) {
              core.info(`Issue #${number} passed the format check.`);
              return;
            }

            core.info(`Issue #${number} failed the format check:\n${reasons.join('\n')}`);

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: `This issue was closed automatically because it does not follow the issue format. - 该 Issue 因不符合格式要求已被自动关闭。\n\n${reasons.join('\n')}\n\nPlease fix the problem described above and reopen or recreate the issue. - 请修正以上问题后重新打开或重新提交 Issue。`
            });

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: number,
              state: 'closed',
              state_reason: 'not_planned'
            });
