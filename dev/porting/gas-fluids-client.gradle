gradle.projectsEvaluated {
    rootProject.sourceSets.main.resources.srcDir(rootProject.file('build/porting/gas-fluids-target-assets'))
    def cleanup = rootProject.tasks.register('clearGasFluidReferenceTextures') {
        doLast {
            ['water_still', 'water_flow'].each { name ->
                rootProject.delete(rootProject.file("build/resources/main/assets/minecraft/textures/block/${name}.png"))
                rootProject.delete(rootProject.file("build/resources/main/assets/minecraft/textures/block/${name}.png.mcmeta"))
            }
        }
    }
    rootProject.tasks.named('runClient') {
        systemProperty 'anvilcraft.portVisualScene', 'true'
        systemProperty 'anvilcraft.portCfaItemScene', 'true'
        systemProperty 'anvilcraft.portGasFluidScene', 'true'
        args '--width', '1280', '--height', '720'
        finalizedBy(cleanup)
    }
}
