gradle.projectsEvaluated {
    def output = rootProject.file('build/resources/main/assets/anvilcraft/textures/block/transcendium_block_outline.png.mcmeta').absolutePath
    def original = rootProject.file('src/main/resources/assets/anvilcraft/textures/block/transcendium_block_outline.png.mcmeta').absolutePath
    def restore = rootProject.tasks.register('restoreContainerJeiOutlineAnimation') {
        doLast { new File(output).bytes = new File(original).bytes }
    }
    rootProject.tasks.named('runClient') {
        doFirst { new File(output).text = '{"animation":{"frametime":10,"frames":[0]}}' }
        finalizedBy(restore)
        systemProperty 'anvilcraft.portVisualScene', 'true'
        systemProperty 'anvilcraft.portCfaItemScene', 'true'
        systemProperty 'anvilcraft.portContainerJeiScene', 'true'
        args '--width', '1280', '--height', '720'
    }
}
